name: Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild assets for (e.g., v1.30.1)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  SKIP_FREE_API: "true"
  NX_DAEMON: "false"

jobs:
  release:
    name: Release Extension
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
      HUSKY: 0
    steps:
      - name: Checkout Repo
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Checkout Release Tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Tag
        if: github.event_name != 'workflow_dispatch'
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          publish-script: pnpm run release
          create-github-releases: true
        env:
          SKIP_FREE_API: true

      - name: Build and Zip Extension
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm zip:all

      - name: Upload Extension Zip to Release
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION=$(echo '${{ steps.changesets.outputs.published-packages }}' | jq -r '.[0].version')
            TAG="v$VERSION"
          fi

          gh release upload "$TAG" .output/*-chrome.zip .output/*-edge.zip .output/*-firefox.zip .output/*-sources.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
