name: Prepare Store Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing FlowRead release tag to prepare (no store submission)
        required: true
        type: string

permissions:
  contents: read

env:
  SKIP_FREE_API: "true"
  NX_DAEMON: "false"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check && pnpm lint && pnpm test
      - run: pnpm zip:edge
      - run: node scripts/debug/audit-runtime-network.mjs && node scripts/debug/audit-store.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: FlowRead-store-package
          path: |
            .output/*-edge.zip
            store/
            PRIVACY_POLICY.md
            LICENSE
# Deliberately no submission credentials, upstream IDs or publish step.
